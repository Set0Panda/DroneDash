<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Lane Dodger</title>
<style>
  :root {
    --bg: #0f1220;
    --road: #1b1f33;
    --line: #3a4166;
    --player: #4fd1c5;
    --enemy: #f56565;
    --coin: #f6e05e;
    --text: #e8ecf8;
    --muted: #8b93b5;
    --accent: #4fd1c5;
    --card: #232845;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none;
  }
  #wrap { position: relative; width: 100%; height: 100%; max-width: 480px; margin: 0 auto; }
  canvas { display: block; width: 100%; height: 100%; }
  #hud {
    position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-between;
    align-items: center; padding: 12px 16px; font-weight: 700; font-size: 18px; pointer-events: none;
    text-shadow: 0 2px 4px rgba(0,0,0,.5);
  }
  #lives { letter-spacing: 4px; color: var(--enemy); }
  .overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 14px; background: rgba(10, 12, 24, .82); text-align: center; padding: 16px;
  }
  .overlay.hidden { display: none; }
  .overlay h1 { margin: 0; font-size: 40px; letter-spacing: 1px; }
  .overlay p { margin: 0; color: var(--muted); line-height: 1.5; }
  .overlay .big { font-size: 22px; color: var(--text); font-weight: 700; }
  button {
    font: inherit; font-size: 20px; font-weight: 700; color: #0f1220; background: var(--accent);
    border: 0; border-radius: 12px; padding: 14px 36px; cursor: pointer; margin-top: 8px;
    box-shadow: 0 6px 0 #2c8f86; transition: transform .08s, box-shadow .08s;
  }
  button:active { transform: translateY(4px); box-shadow: 0 2px 0 #2c8f86; }

  /* ---- How-to-play popup ---- */
  #intro { background: rgba(10, 12, 24, .7); }
  .card {
    width: 100%; max-width: 340px; background: var(--card); border-radius: 20px; padding: 24px 20px 22px;
    display: flex; flex-direction: column; align-items: center; gap: 14px;
    box-shadow: 0 20px 50px rgba(0,0,0,.5); animation: cardIn .35s cubic-bezier(.2,1.4,.4,1);
  }
  @keyframes cardIn { from { transform: scale(.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .card h1 { font-size: 32px; }
  .card h2 { margin: 0; font-size: 14px; text-transform: uppercase; letter-spacing: 3px; color: var(--muted); }

  /* mini road demo: 3 lanes, 60px each */
  .demo {
    position: relative; width: 180px; height: 150px; background: var(--road); border-radius: 12px; overflow: hidden;
    background-image:
      linear-gradient(var(--line) 60%, transparent 60%),
      linear-gradient(var(--line) 60%, transparent 60%);
    background-size: 4px 24px, 4px 24px;
    background-position: 58px 0, 118px 0;
    background-repeat: repeat-y;
    animation: roadMove .6s linear infinite;
  }
  @keyframes roadMove { to { background-position: 58px 24px, 118px 24px; } }
  .demo .car {
    position: absolute; bottom: 14px; left: 76px; width: 28px; height: 40px; border-radius: 7px;
    background: var(--player); animation: carMove 4.5s infinite;
  }
  .demo .car::before, .demo .car::after {
    content: ""; position: absolute; left: 4px; right: 4px; border-radius: 3px; background: rgba(15,18,32,.75);
  }
  .demo .car::before { top: 7px; height: 9px; }
  .demo .car::after { bottom: 7px; height: 7px; }
  @keyframes carMove {
    0%, 8%   { left: 76px; }
    14%, 41% { left: 136px; }
    47%, 74% { left: 16px; }
    80%, 100% { left: 76px; }
  }
  .demo .tap {
    position: absolute; top: 48px; left: 150px; width: 44px; height: 44px; margin: -22px 0 0 -22px;
    border-radius: 50%; border: 3px solid var(--text); opacity: 0; animation: tapMove 4.5s infinite;
  }
  .demo .tap::after {
    content: ""; position: absolute; inset: 11px; border-radius: 50%; background: var(--text);
  }
  @keyframes tapMove {
    0%   { left: 150px; opacity: 0; transform: scale(.5); }
    5%   { left: 150px; opacity: 1; transform: scale(.7); }
    20%  { left: 150px; opacity: 0; transform: scale(1.3); }
    33%  { left: 30px;  opacity: 0; transform: scale(.5); }
    38%  { left: 30px;  opacity: 1; transform: scale(.7); }
    53%  { left: 30px;  opacity: 0; transform: scale(1.3); }
    66%  { left: 90px;  opacity: 0; transform: scale(.5); }
    71%  { left: 90px;  opacity: 1; transform: scale(.7); }
    86%  { left: 90px;  opacity: 0; transform: scale(1.3); }
    100% { left: 90px;  opacity: 0; transform: scale(.5); }
  }
  .lead { color: var(--text) !important; font-weight: 600; font-size: 17px; }
  .rules { list-style: none; margin: 0; padding: 0; width: 100%; display: grid; gap: 10px; text-align: left; }
  .rules li { display: flex; align-items: center; gap: 12px; font-size: 15px; }
  .rules .ico { flex: none; width: 26px; height: 26px; display: grid; place-items: center; }
  .ico.block { background: var(--enemy); border-radius: 6px; width: 24px; height: 20px; }
  .ico.coin { background: var(--coin); border-radius: 50%; width: 20px; height: 20px; }
  .ico.heart { color: var(--enemy); font-size: 22px; }
  .keys { font-size: 13px; }

  /* ---- Countdown ---- */
  #count {
    position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none;
    font-size: 120px; font-weight: 900; color: var(--text); text-shadow: 0 6px 24px rgba(0,0,0,.6);
  }
  #count.go { color: var(--accent); font-size: 96px; }
  #count span { display: block; }
  #count .pop { animation: pop .9s ease-out forwards; }
  @keyframes pop {
    0%   { transform: scale(1.8); opacity: 0; }
    20%  { transform: scale(1);   opacity: 1; }
    75%  { transform: scale(.95); opacity: 1; }
    100% { transform: scale(.7);  opacity: 0; }
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <div id="hud"><span id="score">0</span><span id="lives"></span></div>
  <div id="count"></div>

  <div id="intro" class="overlay">
    <div class="card" role="dialog" aria-labelledby="introTitle">
      <h1 id="introTitle">Lane Dodger</h1>
      <h2>How to play</h2>
      <div class="demo" aria-hidden="true"><div class="car"></div><div class="tap"></div></div>
      <p class="lead">Tap any lane to jump straight there.<br>Hold and drag to slide across.</p>
      <ul class="rules">
        <li><span class="ico"><span class="ico block"></span></span>Dodge the red blocks</li>
        <li><span class="ico"><span class="ico coin"></span></span>Grab coins for +50 points</li>
        <li><span class="ico heart">♥</span>3 lives – the road keeps getting faster</li>
      </ul>
      <p class="keys">Keyboard: ← → or A / D</p>
      <button id="startBtn">Got it!</button>
    </div>
  </div>

  <div id="over" class="overlay hidden">
    <h1>Crashed!</h1>
    <p class="big">Score: <span id="finalScore">0</span></p>
    <p>Best: <span id="best">0</span></p>
    <button id="retryBtn">Retry</button>
  </div>
</div>

<script>
(() => {
  const LANES = 3;
  const MAX_LIVES = 3;
  const INVULN_TIME = 1.5; // seconds after a hit
  const COUNTDOWN = 3;     // 3-2-1, then GO

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const livesEl = document.getElementById('lives');
  const introEl = document.getElementById('intro');
  const overEl = document.getElementById('over');
  const finalEl = document.getElementById('finalScore');
  const bestEl = document.getElementById('best');
  const countEl = document.getElementById('count');

  let W = 0, H = 0, dpr = 1, laneW = 0;
  let state = 'menu'; // menu | countdown | play | over
  let player, objects, score, lives, speed, spawnTimer, invuln, roadOffset, shake, particles, last;
  let countT = 0, shownCount = null;

  function readBest() { try { return +localStorage.getItem('laneDodgerBest') || 0; } catch { return 0; } }
  function writeBest(v) { try { localStorage.setItem('laneDodgerBest', v); } catch {} }

  function resize() {
    const r = canvas.getBoundingClientRect();
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = r.width; H = r.height;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    laneW = W / LANES;
    if (player) { player.x = laneX(player.lane); player.w = Math.min(laneW * 0.55, 70); }
  }
  window.addEventListener('resize', resize);
  resize();

  const laneX = lane => laneW * lane + laneW / 2;

  function reset() {
    player = { lane: 1, x: laneX(1), y: H - 110, w: Math.min(laneW * 0.55, 70), h: 80 };
    objects = [];
    particles = [];
    score = 0; lives = MAX_LIVES; speed = 280; spawnTimer = 0.6; invuln = 0; roadOffset = 0; shake = 0;
    updateHud();
  }

  function updateHud() {
    scoreEl.textContent = Math.floor(score);
    livesEl.textContent = '♥'.repeat(lives) + '♡'.repeat(MAX_LIVES - lives);
  }

  // Lane changes work during the countdown too, so you can line up before GO.
  const canSteer = () => state === 'play' || state === 'countdown';

  function move(dir) {
    if (!canSteer()) return;
    player.lane = Math.max(0, Math.min(LANES - 1, player.lane + dir));
  }

  function spawn() {
    // Block 1–2 lanes, always leave at least one free
    const blocks = Math.random() < Math.min(0.15 + score / 4000, 0.55) ? 2 : 1;
    const lanes = [0, 1, 2].sort(() => Math.random() - 0.5);
    const h = 60 + Math.random() * 30;
    for (let i = 0; i < blocks; i++) {
      objects.push({ type: 'enemy', lane: lanes[i], y: -h, w: laneW * 0.62, h });
    }
    if (Math.random() < 0.35) {
      objects.push({ type: 'coin', lane: lanes[LANES - 1], y: -h - 120, w: 28, h: 28 });
    }
  }

  function burst(x, y, color, n) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, s = 80 + Math.random() * 260;
      particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.6, color });
    }
  }

  function hit(o) {
    if (o.type === 'coin') {
      score += 50; o.dead = true;
      burst(laneX(o.lane), o.y + o.h / 2, getVar('--coin'), 12);
      return;
    }
    if (invuln > 0) return;
    o.dead = true;
    lives--; invuln = INVULN_TIME; shake = 0.35;
    burst(player.x, player.y + player.h / 2, getVar('--enemy'), 24);
    if (navigator.vibrate) navigator.vibrate(120);
    updateHud();
    if (lives <= 0) gameOver();
  }

  function gameOver() {
    state = 'over';
    const best = Math.max(readBest(), Math.floor(score));
    writeBest(best);
    finalEl.textContent = Math.floor(score);
    bestEl.textContent = best;
    overEl.classList.remove('hidden');
  }

  function showCount(text) {
    countEl.classList.toggle('go', text === 'GO!');
    countEl.innerHTML = '';
    const s = document.createElement('span');
    s.textContent = text;
    s.className = 'pop';
    countEl.appendChild(s);
  }

  // Closing the popup or pressing Retry: fresh run, then 3-2-1-GO.
  function beginCountdown() {
    reset();
    introEl.classList.add('hidden');
    overEl.classList.add('hidden');
    state = 'countdown';
    countT = COUNTDOWN;
    shownCount = null;
  }

  // Retry: no countdown, just a quick GO! and straight back in.
  function restart() {
    reset();
    overEl.classList.add('hidden');
    state = 'play';
    showCount('GO!');
  }

  const cssCache = {};
  function getVar(n) {
    return cssCache[n] || (cssCache[n] = getComputedStyle(document.documentElement).getPropertyValue(n).trim());
  }

  function slidePlayer(dt) {
    player.x += (laneX(player.lane) - player.x) * Math.min(1, dt * 28);
    player.y = H - 110;
  }

  function update(dt) {
    const roadSpeed = state === 'play' ? speed : 120;
    roadOffset = (roadOffset + roadSpeed * dt) % 80;
    particles.forEach(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; });
    particles = particles.filter(p => p.life > 0);
    if (shake > 0) shake -= dt;

    if (state === 'countdown') {
      slidePlayer(dt);
      countT -= dt;
      const n = Math.ceil(countT);
      if (countT <= 0) {
        state = 'play';
        showCount('GO!');
      } else if (n !== shownCount) {
        shownCount = n;
        showCount(String(n));
      }
      return;
    }
    if (state !== 'play') return;

    speed += 9 * dt;               // gradually faster
    score += speed * dt * 0.05;
    invuln = Math.max(0, invuln - dt);
    slidePlayer(dt);

    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      spawn();
      spawnTimer = Math.max(0.38, 260 / speed * 0.9) + Math.random() * 0.25;
    }

    const px = player.x - player.w / 2, py = player.y;
    for (const o of objects) {
      o.y += speed * dt;
      const ox = laneX(o.lane) - o.w / 2;
      if (!o.dead && ox < px + player.w - 6 && ox + o.w > px + 6 && o.y < py + player.h - 6 && o.y + o.h > py + 6) {
        hit(o);
      }
    }
    objects = objects.filter(o => !o.dead && o.y < H + 50);
    updateHud();
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawCar(x, y, w, h, color) {
    ctx.fillStyle = color;
    roundRect(x - w / 2, y, w, h, 12); ctx.fill();
    ctx.fillStyle = 'rgba(15,18,32,.75)';
    roundRect(x - w / 2 + 8, y + 14, w - 16, h * 0.25, 6); ctx.fill();
    roundRect(x - w / 2 + 8, y + h * 0.62, w - 16, h * 0.18, 6); ctx.fill();
  }

  function draw() {
    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - 0.5) * 12, (Math.random() - 0.5) * 12);

    ctx.fillStyle = getVar('--road');
    ctx.fillRect(-10, -10, W + 20, H + 20);

    // lane dividers
    ctx.fillStyle = getVar('--line');
    for (let i = 1; i < LANES; i++) {
      for (let y = -80 + roadOffset; y < H; y += 80) ctx.fillRect(laneW * i - 3, y, 6, 44);
    }

    // objects
    for (const o of objects) {
      const cx = laneX(o.lane);
      if (o.type === 'enemy') {
        ctx.fillStyle = getVar('--enemy');
        roundRect(cx - o.w / 2, o.y, o.w, o.h, 10); ctx.fill();
        ctx.fillStyle = 'rgba(0,0,0,.25)';
        roundRect(cx - o.w / 2 + 6, o.y + o.h - 14, o.w - 12, 8, 4); ctx.fill();
      } else {
        ctx.fillStyle = getVar('--coin');
        ctx.beginPath(); ctx.arc(cx, o.y + o.h / 2, o.w / 2, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = 'rgba(0,0,0,.2)';
        ctx.beginPath(); ctx.arc(cx, o.y + o.h / 2, o.w / 4, 0, Math.PI * 2); ctx.fill();
      }
    }

    // player (blinks while invulnerable)
    if (!(invuln > 0 && Math.floor(invuln * 12) % 2 === 0)) {
      drawCar(player.x, player.y, player.w, player.h, getVar('--player'));
    }

    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life / 0.6);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - 3, p.y - 3, 6, 6);
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  function loop(t) {
    const dt = Math.min(0.05, (t - (last || t)) / 1000);
    last = t;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  // ---- Input ----
  window.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') move(-1);
    else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') move(1);
    else if ((e.key === 'Enter' || e.key === ' ') && state === 'menu') { e.preventDefault(); beginCountdown(); }
    else if ((e.key === 'Enter' || e.key === ' ') && state === 'over') { e.preventDefault(); restart(); }
  });

  // Touch / mouse: the car goes straight to the lane under your finger,
  // and follows it while you drag — so lane 1 → 3 is a single touch.
  let dragging = false;
  function goToPointerLane(e) {
    if (!canSteer()) return;
    const r = canvas.getBoundingClientRect();
    const lane = Math.floor((e.clientX - r.left) / (r.width / LANES));
    player.lane = Math.max(0, Math.min(LANES - 1, lane));
  }
  canvas.addEventListener('pointerdown', e => {
    dragging = true;
    canvas.setPointerCapture(e.pointerId);
    goToPointerLane(e);
  });
  canvas.addEventListener('pointermove', e => { if (dragging) goToPointerLane(e); });
  const endDrag = () => { dragging = false; };
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);

  document.getElementById('startBtn').addEventListener('click', beginCountdown);
  document.getElementById('retryBtn').addEventListener('click', restart);

  reset();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
